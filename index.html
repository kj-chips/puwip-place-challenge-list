<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPCL - Puwip Place Challenge List</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #66fcf1;
            text-align: center;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .tab-btn {
            flex: 1;
            background-color: #1f2833;
            color: #c5c6c7;
            border: 2px solid #1f2833;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background-color: #0b0c10;
            color: #66fcf1;
            border-color: #66fcf1;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        .level-card {
            background-color: #1f2833;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden; /* Keeps thumbnail corners rounded */
            border-bottom: 3px solid #1f2833;
        }
        /* Auto-loading YouTube Thumbnail Box */
        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(90deg, #1f2833 25%, #2c3540 50%, #1f2833 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite;
            position: relative;
        }
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .level-details {
            padding: 15px;
        }
        .rank {
            color: #66fcf1;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 2px;
        }
        .level-name {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .level-info-text {
            margin: 0 0 15px 0;
            line-height: 1.4;
            font-size: 14px;
        }
        .video-btn {
            display: block;
            background-color: #66fcf1;
            color: #0b0c10;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }
        .leaderboard-card {
            background-color: #1f2833;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-rank {
            color: #66fcf1;
            font-weight: bold;
            width: 30px;
        }
        .player-name {
            color: #fff;
            font-weight: bold;
        }
        .player-points {
            color: #66fcf1;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HEADER -->
        <h1>Puwip Place Challenge List</h1>
        <div class="subtitle">Official PPCL Rankings & Leaderboards</div>
        
        <!-- MENU BUTTONS -->
        <div class="nav-tabs">
            <button id="list-btn" class="tab-btn active" onclick="switchTab('list')">The List</button>
            <button id="leaderboard-btn" class="tab-btn" onclick="switchTab('leaderboard')">Leaderboard</button>
        </div>
        
        <!-- CHALLENGE LIST SECTION -->
        <div id="list-section" class="page-section active">
            
            <!-- LEVEL #1 -->
            <div class="level-card">
                <div class="thumbnail-container">
                    <!-- LEAVE AS IS OR REPLACE 'placeholder' WITH YOUR YOUTUBE VIDEO ID -->
                    <img src="https://youtube.com" alt="Level Thumbnail" onerror="this.style.display='none'">
                </div>
                <div class="level-details">
                    <div class="rank">#1</div>
                    <div class="level-name">Type Level Name Here</div>
                    <p class="level-info-text">Creator: Type Creator Name <br> ID: 00000000</p>
                    <a href="https://youtube.com" class="video-btn" target="_blank">Watch Video</a>
                </div>
            </div>

            <!-- LEVEL #2 -->
            <div class="level-card">
                <div class="thumbnail-container">
                    <!-- LEAVE AS IS OR REPLACE 'placeholder' WITH YOUR YOUTUBE VIDEO ID -->
                    <img src="https://youtube.com" alt="Level Thumbnail" onerror="this.style.display='none'">
                </div>
                <div class="level-details">
                    <div class="rank">#2</div>
                    <div class="level-name">Type Another Level Name</div>
                    <p class="level-info-text">Creator: Type Creator Name <br> ID: 00000000</p>
                    <a href="https://youtube.com" class="video-btn" target="_blank">Watch Video</a>
                </div>
            </div>
            
        </div>

        <!-- LEADERBOARD SECTION -->
        <div id="leaderboard-section" class="page-section">
            <!-- PLAYER #1 -->
            <div class="leaderboard-card">
                <div class="player-info">
                    <div class="player-rank">#1</div>
                    <div class="player-name">Player Name Here</div>
                </div>
                <div class="player-points">500 Points</div>
            </div>

            <!-- PLAYER #2 -->
            <div class="leaderboard-card">
                <div class="player-info">
                    <div class="player-rank">#2</div>
                    <div class="player-name">Another Player</div>
                </div>
                <div class="player-points">350 Points</div>
            </div>
        </div>

    </div>

    <!-- SCRIPT FOR SWITCHING VIEWS -->
    <script>
        function switchTab(tabName) {
            document.getElementById('list-section').classList.remove('active');
            document.getElementById('leaderboard-section').classList.remove('active');
            document.getElementById('list-btn').classList.remove('active');
            document.getElementById('leaderboard-btn').classList.remove('active');
            
            if(tabName === 'list') {
                document.getElementById('list-section').classList.add('active');
                document.getElementById('list-btn').classList.add('active');
            } else {
                document.getElementById('leaderboard-section').classList.add('active');
                document.getElementById('leaderboard-btn').classList.add('active');
            }
        }
    </script>

</body>
</html>
